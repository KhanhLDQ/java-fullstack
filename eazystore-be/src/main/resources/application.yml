spring:
  application:
    name: eazystore-be
  datasource:
    url: jdbc:mysql://localhost:3306/fullstack-db
    username: tom
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate #control how Hibernate manages db schema at startup - only check that the schema matches entities
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true #validate checksum of applied migrations - fails if files were changed after being applied
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
      stop:
        command: stop
      start:
        command: up
  main:
    banner-mode: off
#  security:
#    user:
#      name: tom
#      password: 123456
#      roles: ADMIN,USER

logging:
  pattern:
    console: "%green(%d{yyyy-MM-dd HH:mm:ss.SSS}) %blue(%-5level) %magenta(${PID:- }) --- %red([%15.15thread]) %yellow(%-40.40logger{39}): %msg%n%wEx"
  level:
    org.tommap.eazystorebe: debug
    org.hibernate.orm.jdbc.bind: trace

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    configprops:
      show-values: always
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    description: Backend for EazyStore E-commerce Application
    version: 1.0.0
    contact:
      email: khanh@eazystore.be.com

jwt:
  secret: ${JWT_SECRET:f27f63142c9dedc3ee9557f3278e0ca0fe70b2f51d003e55e6b92d6437e1ffb0} #hash value tom-secret-key
  expiration: ${JWT_EXPIRATION:3600000} #milisecond